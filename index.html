<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon Banking - Demo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f7fa; margin: 0; padding: 0; }
  .header { background: #0a2540; color: white; padding: 16px; display: flex; justify-content: space-between; align-items: center; }
  .container { padding: 20px; max-width: 600px; margin: auto; }
  .balance-card { background: #0a2540; color: white; padding: 24px; border-radius: 16px; margin-bottom: 20px; }
  .balance-card h2 { font-size: 32px; margin: 8px 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .btn { background: white; padding: 16px; border-radius: 12px; text-align: center; border: none; cursor: pointer; font-weight: 600; }
  .btn-primary { background: #0a2540; color: white; width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 16px; cursor: pointer; }
  .insights-card { background: white; padding: 16px; border-radius: 12px; margin-bottom: 20px; }
  .transactions { background: white; padding: 16px; border-radius: 12px; }
  .transaction { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #eee; }
  .demo-banner { background: #fff3cd; color: #856404; text-align: center; padding: 8px; font-size: 12px; font-weight: 600; }
  
  /* Login styles */
  #loginPage { display: flex; justify-content: center; align-items: center; height: 100vh; background: #0a2540; }
  .login-box { background: white; padding: 32px; border-radius: 16px; width: 90%; max-width: 400px; }
  .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; }
  #dashboard { display: none; }
  .logout-btn { background: transparent; border: 1px solid white; color: white; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage">
  <div class="login-box">
    <h2 style="text-align:center; color:#0a2540">Horizon Banking</h2>
    <p style="text-align:center; color:#666">Demo Login</p>
    <p style="text-align:center; font-size:12px; background:#eef; padding:8px; border-radius:8px">
      Use: <b>demo@horizon.com</b> / <b>password123</b>
    </p>
    <input type="email" id="email" placeholder="Email" value="demo@horizon.com">
    <input type="password" id="password" placeholder="Password" value="password123">
    <button class="btn-primary" onclick="login()">Login</button>
    <p id="error" style="color:red; text-align:center; display:none">Invalid credentials</p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="demo-banner">DEMO MODE - NOT A REAL BANK - ALL DATA IS FICTIONAL</div
